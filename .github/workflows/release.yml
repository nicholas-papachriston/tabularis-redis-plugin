name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Resolve successful build run ID for this commit on main
        id: build-run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "build.yml",
              head_sha: context.sha,
              status: "completed",
              per_page: 100
            });

            const candidates = data.workflow_runs.filter((run) =>
              run.conclusion === "success" &&
              run.event === "push" &&
              run.head_branch === "main"
            );

            if (candidates.length === 0) {
              core.setFailed(
                `No successful build.yml push run found on main for commit ${context.sha}. ` +
                "Ensure the commit was built on main before creating the tag."
              );
              return;
            }

            candidates.sort((a, b) => b.run_number - a.run_number);
            core.setOutput("run_id", String(candidates[0].id));

      - name: Download build artifacts from main build run
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build-run.outputs.run_id }}
          path: artifacts
          pattern: redis-plugin-*
          merge-multiple: true

      - name: Align manifest version inside release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir rewritten
          for archive in artifacts/*.zip; do
            name="$(basename "$archive")"
            workdir="$(mktemp -d)"
            unzip -q "$archive" -d "$workdir"
            jq --arg v "$version" '.version = $v' "$workdir/manifest.json" > "$workdir/manifest.tmp.json"
            mv "$workdir/manifest.tmp.json" "$workdir/manifest.json"
            (
              cd "$workdir"
              zip -qr "$GITHUB_WORKSPACE/rewritten/$name" .
            )
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: rewritten/*.zip
          generate_release_notes: false
