[package]
name = "tabularis-redis-plugin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "tabularis-redis-plugin"
path = "src/main.rs"

[[bin]]
name = "test_plugin"
path = "src/bin/test_plugin.rs"

[dependencies]
base64 = "0.22"
beef = { version = "0.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "1.0", features = ["tls-rustls", "cluster", "sentinel"] }
sqlparser = "0.61"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
