[package]
name = "tabularis-redis-plugin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tabularis-redis-plugin"
path = "src/main.rs"

[[bin]]
name = "test_plugin"
path = "src/bin/test_plugin.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = "1.0.4"
log = "0.4"
env_logger = "0.11"
