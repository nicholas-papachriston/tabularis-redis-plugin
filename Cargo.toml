[package]
name = "tabularis-redis-plugin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tabularis-redis-plugin"
path = "src/main.rs"

[[bin]]
name = "test_plugin"
path = "src/bin/test_plugin.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "1.0.4", features = ["tls-rustls", "cluster"] }
sqlparser = "0.61"
log = "0.4"
env_logger = "0.11"
